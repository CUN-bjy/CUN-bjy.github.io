title: Junyeob Baek
name: Junyeob Baek
position: PhD Student 
email: wnsdlqjtm@kaist.ac.kr
description: >-
  I am a second-year Ph.D. student at KAIST working with [Prof. Sungjin Ahn](https://mlml.kaist.ac.kr/sungjinahn). Previously, I worked at Mila-Quebec AI Institute as a visiting student, collaborating with [Yoshua Bengio](https://yoshuabengio.org/)'s group and [LawZero](https://lawzero.org/en) team members. 
  My research goal lies in building lifelong developmental agents, but safety-garuanteed. To achieve this, I am particularly interested in world modeling, interpretability, open-ended learning, and the alignment problem. 
  Prior to my Ph.D., I received my MS from [KAIST](https://mlml.kaist.ac.kr/) under the supervision of Prof. Sungjin Ahn. Before entering academia, I worked for 4.5 years in industry, gaining practical experience in robotics at [Syscon Robotics](https://sysconrobotics.com/us/index.html) and AI at [Makinarocks](https://www.makinarocks.ai/en/).

